# Conda environment for the Cagetti2005tk REMARK.
#
# This file is the conda fallback when `uv` is not available. The canonical
# dependency source is pyproject.toml + uv.lock at the repo root, which
# pins exact versions and is what reproduce_min.sh / binder/postBuild use.
#
# Quick start with conda:
#   conda env create -f environment.yml
#   conda activate cagetti2005tk
#   ./reproduce_min.sh
#
# Quick start with uv (recommended):
#   uv sync --frozen
#   source .venv/bin/activate
#   ./reproduce_min.sh
#
# Note on scope: this file lists only what the supported minimal
# reproduction needs (numpy / scipy / pandas / matplotlib / jupyter).
# `econ-ark` and `sequence-jacobian`, which were previously listed here,
# are required only by the legacy HAFiscal-inherited tree under legacy/
# and have been moved to the optional `legacy` dependency group in
# pyproject.toml. They are NOT needed for ./reproduce_min.sh to succeed.

name: cagetti2005tk
channels:
  - conda-forge

dependencies:
  - python=3.9

  # Core scientific computing stack
  - numpy>=1.24,<2
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7

  # Jupyter (required for nbconvert in reproduce_min.sh)
  - jupyter>=1.0
  - notebook>=7.0
  - ipykernel>=6.0

  # pip available so a reviewer can `pip install -e .[legacy]` if they
  # want to opt into the optional HAFiscal-only dependencies.
  - pip
