# Minimal Binder bootstrap for the Cagetti2005tk REMARK.
#
# We deliberately do NOT list project Python dependencies here. The
# canonical dependency source is pyproject.toml / uv.lock at the repo
# root; binder/postBuild runs `uv sync --frozen --all-groups` to install
# exactly those locked versions. Keeping this file short avoids the
# classic "binder/environment.yml vs pyproject.toml" drift where the two
# disagree and Binder silently solves to different numpy/scipy versions
# than the local reproduction.

name: cagetti2005tk
channels:
  - conda-forge

dependencies:
  - python=3.9
  - pip
  - pip:
      - uv
